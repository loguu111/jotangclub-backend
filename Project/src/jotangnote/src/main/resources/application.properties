spring.application.name=jotangnote
spring.datasource.url=jdbc:mysql://localhost:3306/jotangnote?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
# 数据库账号从【环境变量】读取，不要把密码写进仓库：
#   DB_USERNAME  不配时默认 root
#   DB_PASSWORD  没有默认值，必须自己配置（否则连不上数据库）
# 配置方式见仓库根目录的 .env.example
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.jotang.jotangnote.entity
mybatis.configuration.map-underscore-to-camel-case=true
#此处开始为 AI 添加
# ===== Redis（P1-02 起使用：存放登录 token） =====
spring.data.redis.host=localhost
spring.data.redis.port=6379
# 本机 Redis 没有设密码，需要时再打开下面这行
# spring.data.redis.password=

# 登录 token 的有效期（单位：天）
jotangnote.token.ttl-days=7

# 笔记缓存的过期时间（单位：分钟）
jotangnote.cache.note-ttl-minutes=10

# ===== RabbitMQ（P3 起使用：笔记的增删改变成异步消息） =====
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# 处理失败的消息不重新入队（否则会无限循环重投、刷爆日志）。
# 生产环境更规范的做法是配置死信队列（DLQ），把失败消息收起来人工处理。
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ===== AI 大模型（进阶篇：/chat 接口） =====
# DeepSeek 与 MiMo 都提供 OpenAI 兼容接口，换供应商只需要改这三行
jotangnote.ai.base-url=https://api.deepseek.com
jotangnote.ai.model=deepseek-chat
# ⚠️ API Key 千万不要写死在这里再提交到仓库！
#    用环境变量传入：export DEEPSEEK_API_KEY=sk-xxxx
jotangnote.ai.api-key=${DEEPSEEK_API_KEY:}
# 会话记录在 Redis 里的存活时间（分钟）
jotangnote.ai.conversation-ttl-minutes=60
#此处结束